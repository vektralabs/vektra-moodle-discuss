name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: PHP Syntax & Moodle Code Style
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: cs2pr

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -not -path './spike/*' | xargs -n1 php -l

      - name: Install Moodle Code Checker
        run: |
          composer create-project moodlehq/moodle-cs moodle-cs --no-interaction
          cd moodle-cs && composer install --no-interaction

      - name: Run phpcs with Moodle standard
        run: |
          set -o pipefail
          ./moodle-cs/vendor/bin/phpcs \
            --standard=moodle \
            --extensions=php \
            --ignore=vendor,moodle-cs,spike \
            --report=checkstyle \
            . | cs2pr

  student-guards:
    name: Student path guards (no '*' postMessage, no storage, no server state)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Self-test the guards
        run: bash ./.github/scripts/test-student-guards.sh

      - name: Run the guards
        run: bash ./.github/scripts/assert-student-guards.sh

  release-zip:
    name: Validate release zip structure
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same command as release.yml: tracked files only, .gitattributes export-ignore applied.
      - name: Build zip
        run: git archive --format=zip --prefix=vektradiscuss/ -o "$RUNNER_TEMP/vektradiscuss.zip" HEAD

      - name: Self-test the release tag assertion
        run: bash ./.github/scripts/test-release-tag.sh

      - name: Validate zip content
        run: bash ./.github/scripts/assert-release-zip.sh "$RUNNER_TEMP/vektradiscuss.zip" vektradiscuss
