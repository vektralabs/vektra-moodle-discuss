# Tests of the Moodle LMS provider (provider/, vektra-stack ADR-0033): its unit tests, the
# conformance kit on the 4.3 and 5.2 recordings, and the joint suites (the vertical's capture,
# canary sinks, IDOR matrix and setup check over those recordings, on real Postgres). The joint
# suites import the vertical's test harness, so they run inside a vektra-stack checkout at the
# commit pinned in provider/vektra-stack.ref. The live suites (-m moodle) skip here as BLOCKED:
# provider-live.yml runs them. provider-release.yml calls this workflow before it builds a wheel.
name: Provider

on:
  push:
    branches: [main, develop]
    paths:
      - "provider/**"
      - ".github/workflows/provider.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "provider/**"
      - ".github/workflows/provider.yml"
  workflow_call:
    outputs:
      stack_ref:
        description: The vektra-stack commit the provider was tested against
        value: ${{ jobs.test.outputs.stack_ref }}

permissions:
  contents: read

jobs:
  test:
    name: Provider tests, conformance kit and joint suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stack_ref: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # runs PR-authored test code: don't leave the token in .git/config
          persist-credentials: false

      - name: Read the pinned vektra-stack commit
        id: ref
        run: |
          sha="$(tr -d '[:space:]' < provider/vektra-stack.ref)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::provider/vektra-stack.ref is not a full commit sha"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: vektralabs/vektra-stack
          ref: ${{ steps.ref.outputs.sha }}
          path: vektra-stack
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "vektra-stack/uv.lock"

      # vektra-shared and the vertical come from the pinned checkout; the provider is installed into
      # the same environment without resolving its dependencies again (vektra-shared is on no index)
      - name: Install the pinned workspace and the provider
        working-directory: vektra-stack
        run: |
          uv sync --dev --frozen
          uv pip install --no-deps -e "$GITHUB_WORKSPACE/provider"

      - name: Provider tests, conformance kit and joint suites
        env:
          VEKTRA_STACK_ROOT: ${{ github.workspace }}/vektra-stack
          # the joint suites' fixtures run `uv run alembic` in the checkout: never sync the provider away
          UV_NO_SYNC: "1"
        run: >
          "$VEKTRA_STACK_ROOT/.venv/bin/python" -m pytest provider/tests -v -rs --tb=short
          --cov=vektra_lms_moodle --cov-config=provider/pyproject.toml
          --cov-report=term-missing --cov-fail-under=95
          --junitxml=lms-moodle.xml

      # A green job is not evidence on its own: the conformance kit ran on both recorded releases,
      # and the joint suites on real Postgres ran, not skipped.
      - name: The conformance kit and the joint suites must have run
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("lms-moodle.xml").getroot()
          cases = list(root.iter("testcase"))
          def ran(fragment):
              hit = [c for c in cases if fragment in (c.get("classname") or "")]
              skipped = [c.get("name") for c in hit if c.find("skipped") is not None]
              return len(hit), skipped
          problems = []
          for fragment, minimum in (
              ("TestMoodle43Conformance", 5),
              ("TestMoodle52Conformance", 5),
              ("integration_moodle.test_setup_check_run", 5),
              ("integration_moodle.test_idor_moodle", 2),
              ("integration_moodle.test_snapshot_canary_db", 1),
              ("test_canary_matrix", 2),
          ):
              n, skipped = ran(fragment)
              print(f"{fragment}: {n} collected, {len(skipped)} skipped")
              if n < minimum or skipped:
                  problems.append(f"{fragment}: {n} collected, skipped={skipped}")
          if problems:
              sys.exit("; ".join(problems))
          PY
